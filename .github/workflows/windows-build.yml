name: Windows Build & Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  JOY_REPO: https://github.com/coder210/joy
  # 与本仓绑定生成所用的 joy 提交保持一致，避免 upsteam 变更导致 CI 飘
  JOY_REF: 50470ae132971e70e830bbc50ec3dbc8202c8443

jobs:
  windows-x64:
    name: Windows x64 (MSVC + Mono)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout joy engine (pinned)
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout $env:JOY_REPO third_party/joy
          git -C third_party/joy checkout $env:JOY_REF

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Mono
        shell: pwsh
        run: |
          $url = "https://download.mono-project.com/archive/6.12.0/windows-installer/mono-6.12.0.199-x64-0.msi"
          Invoke-WebRequest -Uri $url -OutFile mono.msi -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i mono.msi /qn /norestart" -Wait
          if (-not (Test-Path "C:\Program Files\Mono\lib\mono-2.0-sgen.lib")) {
            Write-Error "Mono 安装失败：找不到 mono-2.0-sgen.lib"
            exit 1
          }

      - name: Build C# game assembly
        run: dotnet build csharp/JoyGame.csproj -c Release -o build/csharp

      - name: Configure CMake
        run: >
          cmake -S app -B build/app -A x64
          -DJOY_SOURCE_DIR="${{ github.workspace }}/third_party/joy"
          -DMONO_INCLUDE_DIR="C:/Program Files/Mono/include/mono-2.0"
          -DMONO_LIBRARIES="C:/Program Files/Mono/lib/mono-2.0-sgen.lib"
          -DMONO_RUNTIME_DLL="C:/Program Files/Mono/bin/mono-2.0-sgen.dll"

      - name: Build host
        run: cmake --build build/app --config Release --parallel

      - name: Smoke test (headless)
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          $exe = "build/app/bin/Release/joy_csharp_app.exe"
          if (-not (Test-Path $exe)) { Write-Error "缺少 $exe"; exit 1 }
          $out = & $exe --smoke 180 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $out | Out-File -FilePath smoke.log -Encoding utf8
          if ($code -ne 0) { Write-Error "冒烟失败，exit=$code"; exit $code }
          if (-not ($out -match '\[smoke\] PASS')) { Write-Error "未看到 [smoke] PASS"; exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: joy_csharp-windows-x64
          if-no-files-found: error
          path: |
            build/app/bin/Release/joy_csharp_app.exe
            build/app/bin/Release/JoyGame.dll
            build/app/bin/Release/mono-2.0-sgen.dll
            build/app/bin/Release/SDL3.dll
            build/app/bin/Release/msgpack-c.dll
            build/app/bin/Release/assets/**
            smoke.log
